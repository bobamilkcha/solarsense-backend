[tools]
python = "3.14.5"

[tasks.init]
description = "Set up a fresh clone: install deps (incl. dev) and git hooks"
run = [
    "uv sync",
    "uv run pre-commit install",
]

[tasks.db-up]
description = "Run the database container"
run = "docker compose up --wait -d db"

[tasks.db-down]
description = "Stop the database container"
run = "docker compose down db"

[tasks.docker-check]
description = "Check container statuses"
run = "docker compose ps"

[tasks.db-reset]
description = "Reset the database"
run = "docker compose down db -v && docker compose up db -d"

[tasks.migrate]
description = "Run database migrations"
depends=["db-up"]
run = "uv run alembic upgrade head"

[tasks.generate-migration]
description = "Generate Migrations"
run = "uv run alembic revision --autogenerate -m \"$@\""

[tasks.generate-secret-key]
description = "Generate a secret key"
run = "uv run python -c \"import secrets; print(secrets.token_hex(32))\""

[tasks.dev]
description = "Run the development server"
depends=["migrate"]
run = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest $@"

[tasks.test-cov]
description = "Run tests with a terminal coverage report"
run = "uv run pytest --cov=app --cov-report=term-missing $@"

[tasks.test-cov-html]
description = "Run tests and write an HTML coverage report to htmlcov/"
run = "uv run pytest --cov=app --cov-report=html $@"

[tasks.export-openapi]
description = "Write the OpenAPI spec to docs/openapi.json (hand it to the frontend)"
run = "uv run python -m scripts.export_openapi"

[tasks.local-up]
description = "Run the production stack on this PC (needs .env.prod; ngrok tunnel starts if NGROK_* are set)"
run = "ENV_FILE=.env.prod docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.local.yml up -d --build"

[tasks.local-down]
description = "Stop the local production stack (keeps the data volumes)"
run = "ENV_FILE=.env.prod docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.local.yml down"

[tasks.local-logs]
description = "Follow the local production stack's logs (e.g. mise run local-logs api)"
run = "ENV_FILE=.env.prod docker compose --env-file .env.prod -f docker-compose.prod.yml -f docker-compose.local.yml logs -f --tail 100 $@"

[tasks.local-backup]
description = "Dump the local production database to backups/ (keeps 7)"
run = "ENV_FILE=.env.prod COMPOSE_FILES='-f docker-compose.prod.yml -f docker-compose.local.yml' ./deploy/backup.sh"
